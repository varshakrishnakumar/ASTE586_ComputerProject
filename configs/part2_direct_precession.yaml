# Part 2 -- axisymmetric body, direct precession.
# Symmetry axis is body-2 (I1 = I3, I2 smallest)  ->  I_lat > I_sym.
name: part2_direct_precession
description: "axisymmetric body, symmetry axis 2 (oblate): 10 deg nutation, direct precession"
part: 2
model: rigid
tf: 200.0
n_points: 2000
integrator:
  method: DOP853
  rtol: 1.0e-9
  atol: 1.0e-10
inertia: [5.0, 4.0, 5.0]          # I1, I2, I3  (kg m^2)
initial:
  omega: [0.0182, 0.1289, 0.0]    # rad/s, body coords -> ~10 deg nutation
analysis:
  reference_axis: 2
viz:
  shape: box
  half_extents: [0.30, 0.45, 0.30]
