# Part 3 -- non-axisymmetric body. The angular velocity rides a polhode that
# encircles the major-inertia axis (body-3).
name: part3_nonsymmetric
description: "three distinct inertias, spin near the major axis: a closed polhode"
part: 3
model: rigid
tf: 3.0
n_points: 1500
integrator:
  method: DOP853
  rtol: 1.0e-10
  atol: 1.0e-11
inertia: [3.0, 3.5, 6.0]
initial:
  omega: [1.0, 0.0, 4.0]      # 1*e1 + 4*e3 rad/s
analysis:
  reference_axis: 3
viz:
  shape: box
  half_extents: [0.45, 0.40, 0.25]
