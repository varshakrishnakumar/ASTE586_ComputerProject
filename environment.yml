# Conda environment for the ASTE 586 computer project.
#   conda env create -f environment.yml
#   conda activate aste586
#   pip install -e .
#
# PyBullet is pulled from conda-forge so macOS Apple-Silicon users get a
# prebuilt binary instead of compiling from source (PyPI has no arm64 wheels
# for pybullet, and the bundled-zlib build breaks on recent Xcode SDKs).
name: aste586
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pybullet>=3.2
  - pytest>=7.0
  - pip
